name: Check linter, formatting, tests

on:
  workflow_call:

jobs:
  format_and_lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install deps
        run: npm ci

      - name: Code format
        run: npm run format

      - name: Lint code
        run: npm run lint
